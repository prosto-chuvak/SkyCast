[package]
name = "SkyCast"
version = "1.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5.48", features = ["derive"] }
isahc = { version = "1.8", features = ["json"] }

[profile.release]
codegen-units = 1 
lto = true 
opt-level = 3
strip = true
